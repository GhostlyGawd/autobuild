[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "autobuild-harness"
version = "0.1.0"
description = "A reconciled, self-improving harness for autonomous engineering"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GhostlyGawd" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
autobuild = "autobuild.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autobuild"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

